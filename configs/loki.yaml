# Grafana Loki 3.x, single instance, filesystem storage.  Spec 4.5.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 72h
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      # Index only these three resource attributes; everything else stays
      # structured metadata (service.instance.id: cardinality).
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - deployment.environment.name

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
