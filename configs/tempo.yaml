# Grafana Tempo 3.x, monolithic (target: all), local storage. Spec v0.11, 4.2.
# Not a 2.x config: no ingester, compactor or metrics_generator_client blocks.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Trace retention 72h (spec 6). A top-level `compaction:` block is rejected by
# Tempo 3.1.1. The config reference places block_retention in the compaction
# block used by backend_scheduler and backend_worker; both are set. Whether this
# is the effective setting is checked on the running Tempo (Docker-service-readyness-verification-6.md).
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 72h

backend_worker:
  compaction:
    block_retention: 72h

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
